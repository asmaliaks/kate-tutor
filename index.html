<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Репетитор по английскому языку | Екатерина</title>

  <!-- Meta tags, FontAwesome & Styles (остаются без изменений) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Стили остаемся из предыдущего шага */
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #06b6d4;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
    .top-bar { position: sticky; top: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .main-nav { display: flex; gap: 1.5rem; }
    .main-nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; transition: var(--transition); position: relative; }
    .main-nav a:hover, .main-nav a.active { color: var(--primary); }
    .main-nav a.active::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--primary); border-radius: 2px; }
    .lang-switcher { display: flex; gap: 0.25rem; background: #f1f5f9; padding: 4px; border-radius: 10px; }
    .lang-btn { border: none; background: transparent; color: var(--text-muted); padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: var(--transition); }
    .lang-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .hero { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: white; padding: 5rem 1.5rem; text-align: center; }
    .hero-title { font-size: 2.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    .hero-subtitle { font-size: 1.25rem; opacity: 0.9; max-width: 600px; margin: 0 auto; }
    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem; }
    section { scroll-margin-top: 90px; margin-bottom: 3.5rem; }
    .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title::before { content: ''; display: inline-block; width: 4px; height: 1.25rem; background: var(--primary); border-radius: 2px; }
    .about-card { background: var(--bg-card); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); display: flex; gap: 2rem; align-items: center; border: 1px solid #f1f5f9; }
    .profile-img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2); flex-shrink: 0; }
    .about-text { font-size: 1.05rem; color: #334155; }
    .badge-list { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .badge { background: #e0e7ff; color: var(--primary-dark); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #f1f5f9; transition: var(--transition); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
    .card-icon { font-size: 1.5rem; color: var(--primary); margin-bottom: 0.75rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.95rem; color: var(--text-muted); }
    footer { background: #0f172a; color: white; padding: 3rem 1.5rem; text-align: center; margin-top: auto; }
    .footer-text { color: #94a3b8; margin-bottom: 1.5rem; }
    .social-icons { display: flex; justify-content: center; gap: 1.25rem; }
    .icon-link { width: 52px; height: 52px; border-radius: 50%; background: #1e293b; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; text-decoration: none; transition: var(--transition); border: 1px solid #334155; }
    .icon-link:hover { transform: translateY(-3px) scale(1.05); }
    .icon-link.tg:hover { background: #0088cc; }
    .icon-link.wa:hover { background: #25D366; }
    .icon-link.form:hover { background: var(--primary); }
  </style>
</head>
<body>

<!-- NAVBAR -->
<div class="top-bar">
  <nav class="main-nav">
    <a href="#about" class="nav-link t" data-en="About" data-ru="Обо мне" data-pl="O mnie">Обо мне</a>
    <a href="#experience" class="nav-link t" data-en="Experience" data-ru="Опыт" data-pl="Doświadчение">Опыт</a>
    <a href="#certificates" class="nav-link t" data-en="Certificates" data-ru="Сертификаты" data-pl="Certyfikaty">Сертификаты</a>
    <a href="#cases" class="nav-link t" data-en="Cases" data-ru="Успехи" data-pl="Sukcesy">Успехи</a>
  </nav>

  <div class="lang-switcher">
    <button class="lang-btn" onclick="changeLang('en')">EN</button>
    <button class="lang-btn active" onclick="changeLang('ru')">RU</button>
    <button class="lang-btn" onclick="changeLang('pl')">PL</button>
  </div>
</div>

<!-- HERO SECTION -->
<header class="hero">
  <h1 class="hero-title t" data-en="English with Kate" data-ru="Английский с Екатериной" data-pl="Angielski z Katsiaryną">Английский с Екатериной</h1>
  <p class="hero-subtitle t" data-en="High-performance English tutoring tailored to your goals" data-ru="Эффективное обучение английскому под ваши задачи" data-pl="Skuteczna nauka języka angielskiego dopasowana do Twoich celów">Эффективное обучение английскому под ваши задачи</p>
</header>

<!-- КОНТЕЙНЕР ДЛЯ ДИНАМИЧЕСКИХ СЕКЦИЙ -->
<main id="app-content">
  <!-- Блоки загрузятся сюда автоматически -->
</main>

<!-- FOOTER -->
<footer>
  <p class="footer-text t" data-en="Get in touch or book a trial lesson:" data-ru="Свяжитесь со мной или запишитесь на вводный урок:" data-pl="Skontaktuj się ze mną lub zapisz się na lekcję próbną:">Свяжитесь со мной или запишитесь на вводный урок:</p>
  <div class="social-icons">
    <a href="#" target="_blank" class="icon-link form" title="Form"><i class="fa-solid fa-file-signature"></i></a>
    <a href="https://t.me/YOUR_USERNAME" target="_blank" class="icon-link tg" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
    <a href="https://wa.me/YOUR_NUMBER" target="_blank" class="icon-link wa" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
  </div>
</footer>

<!-- СКТИПТ ДИНАМИЧЕСКОЙ ЗАГРУЗКИ И ПЕРЕКЛЮЧЕНИЯ ЯЗЫКОВ -->
<script>
  const sections = [
    'sections/about.html',
    'sections/experience.html',
    'sections/certificates.html',
    'sections/cases.html'
  ];

  // Асинхронная загрузка всех секций
  async function loadSections() {
    const mainContainer = document.getElementById('app-content');

    try {
      const loadedHtml = await Promise.all(
              sections.map(url => fetch(url).then(res => res.text()))
      );

      mainContainer.innerHTML = loadedHtml.join('');

      // Инициализируем наблюдения за скроллом после загрузки контента
      initScrollObserver();
    } catch (err) {
      console.error("Ошибка при загрузке секций:", err);
    }
  }

  // Логика мультиязычности
  const seoData = {
    ru: { title: "Репетитор по английскому языку | Екатерина", description: "Уроки английского онлайн" },
    en: { title: "English Tutor | Kate", description: "Online English lessons" },
    pl: { title: "Korepetytor języka angielskiego | Katsiaryna", description: "Lekcje angielskiego online" }
  };

  function changeLang(lang) {
    document.querySelectorAll('.t').forEach(el => {
      const text = el.getAttribute(`data-${lang}`);
      if (text) el.textContent = text;
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${lang}'`));
    });

    if (seoData[lang]) {
      document.title = seoData[lang].title;
    }

    document.documentElement.lang = lang;
  }

  // Подсветка активного пункта меню при скролле
  function initScrollObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          document.querySelectorAll('.main-nav a').forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
          });
        }
      });
    }, { threshold: 0.4 });

    document.querySelectorAll('section').forEach(section => observer.observe(section));
  }

  // Старт загрузки при открытии страницы
  document.addEventListener('DOMContentLoaded', loadSections);
</script>
</body>
</html>
