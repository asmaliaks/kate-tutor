<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Английский по сериалам</title>
  <meta name="description" content="Изучайте английский по любимым сериалам: живые диалоги, современная лексика, разбор сцен и мини-курсы для уровней A2–B2.">
  <meta name="author" content="Екатерина">

  <!-- FontAwesome & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #06b6d4;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 1. Сброс базовых отступов и защита от бокового скролла */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden; /* Запрещает горизонтальную прокрутку */
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Автоматическая подгонка всех изображений */
    img {
      max-width: 100%;
      height: auto;
    }

    /* --- STICKY NAVBAR --- */
    .top-bar {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      width: 100%;
    }

    .main-nav {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap; /* Позволяет ссылкам переноситься при необходимости */
    }

    .main-nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition);
      position: relative;
      white-space: nowrap;
    }

    .main-nav a:hover, .main-nav a.active {
      color: var(--primary);
    }

    .main-nav a.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* --- HERO SECTION --- */
    .hero {
      background: linear-gradient(120deg, #4f46e5 0%, #837af6 100%);
      color: white;
      padding: 4rem 1.25rem;
      text-align: center;
      width: 100%;
    }

    .hero-title {
      font-size: clamp(1.8rem, 5vw, 2.75rem); /* Адаптивный размер шрифта */
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 3vw, 1.25rem);
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    /* --- MAIN CONTENT & CARDS --- */
    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }

    section {
      scroll-margin-top: 90px;
      margin-bottom: 3rem;
      width: 100%;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.25rem;
      background: var(--primary);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Profile Block */
    .about-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      display: flex;
      gap: 1.75rem;
      align-items: center;
      border: 1px solid #f1f5f9;
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      image-rendering: auto;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
      flex-shrink: 0;
    }

    .about-text {
      font-size: 1rem;
      color: #334155;
      word-wrap: break-word;
    }

    .badge-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .badge {
      background: #e0e7ff;
      color: var(--primary-dark);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* 2. Адаптивная сетка карточек */
    .grid-cards {
      display: grid;
      /* Используем min(100%, 280px), чтобы карточки сжимались на маленьких экранах */
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    .card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #f1f5f9;
      transition: var(--transition);
      word-wrap: break-word; /* Предотвращает вылезание длинных слов */
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .card-icon {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .serials-shell {
      position: relative;
    }

    .serials-carousel {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(240px, 31%);
      gap: 1.25rem;
      overflow-x: auto;
      padding: 0.25rem 0 1rem;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #c7d2fe transparent;
    }

    .serials-carousel::-webkit-scrollbar {
      height: 8px;
    }

    .serials-carousel::-webkit-scrollbar-thumb {
      background: #c7d2fe;
      border-radius: 999px;
    }

    .serial-card {
      scroll-snap-align: start;
      background: var(--bg-card);
      border: 1px solid #f1f5f9;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
    }

    .serial-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .serial-img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    .serial-content {
      padding: 1rem;
    }

    .serial-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .serial-meta {
      color: var(--primary-dark);
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .serial-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .carousel-controls {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .carousel-btn {
      width: 40px;
      height: 40px;
      border: 1px solid #e2e8f0;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--primary);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 18px -12px rgba(15, 23, 42, 0.4);
    }

    .carousel-btn:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    /* --- FOOTER --- */
    footer {
      background: #0f172a;
      color: white;
      padding: 2.5rem 1.25rem;
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .footer-text {
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .icon-link {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      text-decoration: none;
      transition: var(--transition);
      border: 1px solid #334155;
    }

    .icon-link:hover {
      transform: translateY(-3px) scale(1.05);
    }

    /* 3. АДАПТИВНЫЕ СТИЛИ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
    @media (max-width: 640px) {
      .top-bar {
        flex-direction: column-reverse;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .main-nav {
        justify-content: center;
        gap: 0.75rem 1rem;
        width: 100%;
      }

      .main-nav a {
        font-size: 0.85rem;
      }

      .about-card {
        flex-direction: column;
        text-align: center;
        padding: 1.25rem;
      }

      .badge-list {
        justify-content: center;
      }

      .serials-carousel {
        grid-auto-columns: minmax(240px, 82%);
      }

      .carousel-controls {
        justify-content: center;
      }

      main {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<div class="top-bar">
  <nav class="main-nav">
    <a href="#for-whom" class="nav-link t" data-en="For whoom" data-ru="Для кого" data-pl="Dla kogo">Для кого</a>
    <a href="#serials" class="nav-link t" data-en="Series" data-ru="Сериалы" data-pl="Seriale">Сериалы</a>
    <a href="#about" class="nav-link t" data-en="About me" data-ru="Обо мне" data-pl="O mnie">Обо мне</a>
  </nav>

  <div class="lang-switcher">
    <button class="lang-btn" onclick="changeLang('en')">EN</button>
    <button class="lang-btn active" onclick="changeLang('ru')">RU</button>
    <button class="lang-btn" onclick="changeLang('pl')">PL</button>
  </div>
</div>

<!-- HERO SECTION -->
<header class="hero">
  <h1 class="hero-title t" data-en="Learn English with TV Series" data-ru="Английский по сериалам" data-pl="Ucz się angielskiego z seriali">Английский по сериалам</h1>
  <p class="hero-subtitle t" data-en="Conversational mini-courses for those tired of boring textbooks who want to understand the natural speech of native speakers in its original form." data-ru="Разговорные мини-курсы для тех, кто устал от скучных учебников и хочет понимать живую речь носителей языка в оригинале." data-pl="Konwersacyjne minikursy dla osób, które mają dość nudnych podręczników i chcą rozumieć naturalną mowę native speakerów w oryginale.">Разговорные мини-курсы для тех, кто устал от скучных учебников и хочет понимать живую речь носителей языка в оригинале.</p>
</header>

<!-- КОНТЕЙНЕР ДЛЯ ДИНАМИЧЕСКИХ СЕКЦИЙ -->
<main id="app-content">
  <!-- Блоки загружаются динамически из папки sections/ -->
</main>

<!-- FOOTER -->
<footer>
  <p class="footer-text t" data-en="Get in touch:" data-ru="Свяжитесь со мной:" data-pl="Skontaktuj się ze mną">Свяжитесь со мной:</p>
  <div class="social-icons">
    <a href="https://t.me/Katya_teach_me" target="_blank" class="icon-link tg" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
    <a href="https://wa.me/+48791125399" target="_blank" class="icon-link wa" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
  </div>
</footer>

<!-- СКТИПТ ДИНАМИЧЕСКОЙ ЗАГРУЗКИ И ПЕРЕКЛЮЧЕНИЯ ЯЗЫКОВ -->
<script>
  const sections = [
    'sections/for-whom.html',
    'sections/serials_1.html',
    'sections/about.html'
    // 'sections/certificates.html',
    // 'sections/cases.html'
  ];

  async function loadSections() {
    const mainContainer = document.getElementById('app-content');

    try {
      const loadedHtml = await Promise.all(
              sections.map(url => fetch(url).then(res => res.text()))
      );

      mainContainer.innerHTML = loadedHtml.join('');
      initScrollObserver();
      initSerialsStage();
    } catch (err) {
      console.error("Ошибка при загрузке секций:", err);
    }
  }

  const seoData = {
    ru: {
      title: "Английский по сериалам",
      description: "Изучайте английский по любимым сериалам: живые диалоги, современная лексика, разбор сцен и мини-курсы для уровней A2–B2."
    },
    en: {
      title: "Learn English with TV Seriesr",
      description: "Learn practical English with TV series through real dialogue, modern vocabulary, scene analysis, and mini-courses for A2–B2 learners."
    },
    pl: {
      title: "Angielski z seriali",
      description: "Ucz się praktycznego angielskiego z seriali: naturalne dialogi, współczesne słownictwo, analiza scen i mini-kursy dla poziomów A2–B2."
    }
  };

  function changeLang(lang) {
    document.querySelectorAll('.t').forEach(el => {
      const text = el.getAttribute(`data-${lang}`);
      if (text) el.textContent = text;
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${lang}'`));
    });

    if (seoData[lang]) {
      document.title = seoData[lang].title;
      document.querySelector('meta[name="description"]')
        .setAttribute('content', seoData[lang].description);
    }

    document.documentElement.lang = lang;
  }

  function initScrollObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          document.querySelectorAll('.main-nav a').forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
          });
        }
      });
    }, { threshold: 0.3 });

    document.querySelectorAll('section').forEach(section => observer.observe(section));
  }

  function scrollSerials(direction) {
    const carousel = document.querySelector('.serials-carousel');
    if (!carousel) return;

    carousel.scrollBy({
      left: direction * carousel.clientWidth * 0.85,
      behavior: 'smooth'
    });
  }

  function initSerialsStage() {
    const root = document.querySelector('[data-serials-stage]');
    if (!root || root.dataset.ready === 'true') return;

    const slides = [...root.querySelectorAll('[data-stage-slide]')];
    const tabs = [...root.querySelectorAll('[data-stage-tab]')];
    const prev = root.querySelector('[data-stage-prev]');
    const next = root.querySelector('[data-stage-next]');
    let activeIndex = 0;

    const setActive = (index) => {
      activeIndex = (index + slides.length) % slides.length;

      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle('is-active', slideIndex === activeIndex);
      });

      tabs.forEach((tab, tabIndex) => {
        tab.classList.toggle('is-active', tabIndex === activeIndex);
      });
    };

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => setActive(Number(tab.dataset.stageTab)));
    });

    if (prev) prev.addEventListener('click', () => setActive(activeIndex - 1));
    if (next) next.addEventListener('click', () => setActive(activeIndex + 1));
    root.dataset.ready = 'true';
  }

  document.addEventListener('DOMContentLoaded', loadSections);
</script>
</body>
</html>
